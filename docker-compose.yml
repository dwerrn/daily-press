services:
  daily-press:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DAILY_PRESS_CONFIG_DIR: /app/config
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    ports:
      - "${DAILY_PRESS_BIND_ADDRESS:-192.168.0.123}:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
