[project]
name = "daily-press"
version = "0.1.0"
description = "Personal daily newspaper service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "feedparser>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "openai>=1.68,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daily_press"]

[tool.pytest.ini_options]
testpaths = ["tests"]
